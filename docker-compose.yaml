
services:
  app:
    user: "${USER_ID:-1000}"
    hostname: "${HOST_NAME:-emkademy}"
    image: cybulde-data-preparation
    platform: linux/amd64
    container_name: cybulde-data-preparation-container
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=./creds/emkademy-vladimir-1ab083bf6d75.json
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        USER_NAME: "${USER_NAME:-torre}"
        USER_ID: "${USER_ID:-1000}"
    volumes:
      - ./:/app/
      - ~/.config/gcloud/:/home/${USER_NAME}/.config/gcloud
    ports:
      - 8888:8888

    deploy:
      resources:
        limits:
          memory: 32G

    ipc: host
    init: true


